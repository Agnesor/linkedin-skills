version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # The Python version is pinned in pyproject.toml; move both together by hand.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
