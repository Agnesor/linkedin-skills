[project]
name = "linkedin-skills"
version = "1.0.0"
description = "Find the skills employers ask for most, based on 1.3M LinkedIn job postings from 2024."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ilia Reutov" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "altair==6.3.0",
    "duckdb==2.0.0",
    "pandas==3.1.0",
    "pyarrow==25.0.1",
    "streamlit==1.66.1",
    "xlsxwriter==3.3.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
